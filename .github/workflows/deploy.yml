name: Build and publish static site

on:
  workflow_run:
    workflows: ["Refresh versioned GitHub contributions"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test source
        run: python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - name: Build and verify once (offline)
        run: python preview.py --build-only
      - name: Record source and build run
        env:
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_SHA
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          data = {'source_repository': os.environ['GITHUB_REPOSITORY'],
                  'source_sha': os.environ['SOURCE_SHA'],
                  'source_run': os.environ['SOURCE_RUN'],
                  'built_at': datetime.now(timezone.utc).isoformat()}
          Path('_site/build-info.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          # Only commits to the artifact repository's main branch deploy on Vercel.
          vercel = {'git': {'deploymentEnabled': {'main': True, '*': False}}}
          Path('_site/vercel.json').write_text(json.dumps(vercel, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Create short-lived publishing token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: FuTseYi
          repositories: futseyi.github.io
          permission-contents: write
      - name: Resolve publishing bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Check out static output repository
        uses: actions/checkout@v4
        with:
          repository: FuTseYi/futseyi.github.io
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: published
          persist-credentials: true
      - name: Replace static output and publish
        run: |
          # Ignore volatile build metadata when deciding whether the site changed.
          # This avoids a new deployment for a workflow rerun with identical output.
          if [ -z "$(rsync -rcni --delete --exclude='.git/' --exclude='build-info.json' _site/ published/)" ]; then
            echo 'Website output unchanged; skipping metadata-only publish'
            exit 0
          fi
          rsync -a --delete --exclude='.git/' _site/ published/
          cd published
          git config user.name '${{ steps.app.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.bot.outputs.id }}+${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Static output unchanged'
          else
            git commit -m "Publish source ${SOURCE_SHA}"
            git push origin HEAD:main
          fi
