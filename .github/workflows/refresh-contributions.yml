name: Refresh versioned GitHub contributions

on:
  push:
    branches: [main]
    paths:
      - scripts/refresh_contributions.py
      - .github/workflows/refresh-contributions.yml
  workflow_dispatch:
  schedule:
    - cron: '17 1 1,15 * *'

permissions:
  contents: read

concurrency:
  group: contribution-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh lifetime public contributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/refresh_contributions.py
      - name: Check for snapshot changes
        id: changes
        run: |
          if git diff --quiet -- contributions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create short-lived source-write token
        if: steps.changes.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: FuTseYi
          repositories: FuTseYi-Site-Source
          permission-contents: write
      - name: Commit verified changes to canonical source
        if: steps.changes.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contributions.json
          git commit -m "data: refresh verified public contributions"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" push origin HEAD:main
