name: Synchronize profile README
on:
  push:
    branches: [main]
    paths:
      - index.html
      - posts/**
      - scripts/blog_index.py
      - scripts/post_metadata.py
      - scripts/site_metadata.py
      - scripts/sync_readme.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readme-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify profile content generated from homepage
        run: python -m unittest tests.test_sync_readme -v
      - name: Create short-lived profile token
        id: profile_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: FuTseYi
          repositories: FuTseYi
          permission-contents: write
      - name: Resolve profile bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.profile_token.outputs.token }}
          APP_SLUG: ${{ steps.profile_token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      - name: Synchronize GitHub Profile README
        env:
          PROFILE_README_TOKEN: ${{ steps.profile_token.outputs.token }}
          PROFILE_COMMITTER_NAME: ${{ steps.profile_token.outputs.app-slug }}[bot]
          PROFILE_COMMITTER_EMAIL: ${{ steps.bot.outputs.id }}+${{ steps.profile_token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: python scripts/sync_readme.py --sync-profile
